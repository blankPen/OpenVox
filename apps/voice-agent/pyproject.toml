[project]
name = "openvox"
version = "0.3.1"
description = "OpenVox voice-agent runtime: Volcengine STT/TTS + selectable LLM backend (Hermes / agentd) via LiveKit Agents"
requires-python = ">=3.10"
dependencies = [
    # LiveKit Agents runtime (>=1.6 split the otel / silero / turn-detector
    # "extras" out into top-level packages, so we now declare them explicitly).
    "livekit-agents~=1.6",
    "livekit-plugins-silero~=1.6",
    "livekit-plugins-turn-detector~=1.6",
    "opentelemetry-api~=1.0",
    "opentelemetry-sdk~=1.0",
    "opentelemetry-exporter-otlp~=1.0",
    "livekit-plugins-volcengine~=1.6",
    "livekit-plugins-openai==1.6.4",
    "questionary",
    "rich-argparse",
]

[project.scripts]
openvox = "openvox_worker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openvox_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
