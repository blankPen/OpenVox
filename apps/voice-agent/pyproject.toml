[project]
name = "openvox"
version = "0.2.0"
description = "OpenVox voice-agent runtime: Volcengine STT/TTS + selectable LLM backend (Hermes / agentd) via LiveKit Agents"
requires-python = ">=3.10"
dependencies = [
    "livekit-agents[otel,silero,turn-detector]~=1.5",
    "livekit-plugins-volcengine",
    "livekit-plugins-openai==1.6.4",
    "questionary",
]

[project.scripts]
openvox = "openvox_worker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openvox_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
