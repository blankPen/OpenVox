[project]
name = "openvox"
version = "0.1.0"
description = "OpenVox worker: Volcengine STT/TTS + Hermes OpenAI-compatible LLM via LiveKit Agents"
requires-python = ">=3.10"
dependencies = [
    "livekit-agents[otel,silero,turn-detector]~=1.5",
    "livekit-plugins-volcengine",
    "livekit-plugins-openai==1.6.4",
]

[project.scripts]
openvox = "openvox_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
pythonpath = ["."]  # 让 tests/ 下的 import 找到 main.py 和 hermes_bridge/
