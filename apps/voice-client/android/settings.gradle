pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version '8.10.1' apply false
    id "org.jetbrains.kotlin.android" version "2.1.0" apply false
}

// Allow project-level repositories (added by build.gradle's allprojects block)
// to coexist with the settings-level repositories. The global
// ~/.gradle/init.d/mirrors.gradle init script registers aliyun mirrors via
// beforeSettings { settings.pluginManagement { ... } }; we want those plus
// the project-declared google()/mavenCentral() to coexist.
dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.PREFER_PROJECT
    repositories {
        google()
        mavenCentral()
    }
}

include ":app"
