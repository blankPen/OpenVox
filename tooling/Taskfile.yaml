version: "3"

# OpenVox 主编排
# 起步阶段只列 shell+docker 调用；后续 dev:e2e / dev:client 实施再补

vars:
  PROJECT_NAME: openvox
  REPO_ROOT: "{{.ROOT_DIR}}"
  TOOLING: "{{.ROOT_DIR}}/tooling/scripts"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # ── Dev workflow ────────────────────────────────────────────────
  dev:infra:
    desc: Start LiveKit Server (Docker)
    dir: infra
    cmds:
      - docker compose up -d

  dev:infra-down:
    desc: Stop LiveKit Server
    cmds:
      - task: dev:infra-down-cmd

  dev:infra-down-cmd:
    dir: infra
    cmds:
      - docker compose down

  dev:agent:
    desc: Start voice-agent worker (Python)
    dir: apps/voice-agent
    cmds:
      - python main.py start

  dev:client:
    desc: Start Flutter voice-client
    dir: apps/voice-client
    cmds:
      - flutter run

  dev:up:
    desc: 一键起 LiveKit + agent（不含 client）
    cmds:
      - task: dev:infra
      - task: dev:agent

  dev:down:
    desc: Stop everything
    cmds:
      - task: dev:infra-down

  # ── Local builds ────────────────────────────────────────────────
  build:cli:
    desc: Build both CLIs (agentd + openvox)
    cmds:
      - "{{.TOOLING}}/build-cli.sh all"

  build:cli:agentd:
    desc: Build only agentd (TypeScript → dist/)
    cmds:
      - "{{.TOOLING}}/build-cli.sh agentd"

  build:cli:openvox:
    desc: Build only openvox (Python wheel + sdist)
    cmds:
      - "{{.TOOLING}}/build-cli.sh openvox"

  build:client:
    desc: Build Flutter voice-client for android + ios
    cmds:
      - "{{.TOOLING}}/build-client.sh all"

  build:client:android:
    desc: Build voice-client Android APK (debug)
    cmds:
      - "{{.TOOLING}}/build-client.sh android"

  build:client:ios:
    desc: Build voice-client iOS .app (debug, no codesign)
    cmds:
      - "{{.TOOLING}}/build-client.sh ios"

  build:all:
    desc: Build all CLI + client artifacts locally
    cmds:
      - task: build:cli
      - task: build:client

  # ── Local installs ──────────────────────────────────────────────
  install:cli:
    desc: Build + install both CLIs globally (agentd via npm, openvox via pipx/pip)
    cmds:
      - "{{.TOOLING}}/install-cli.sh all"

  install:cli:agentd:
    desc: Build + install agentd globally
    cmds:
      - "{{.TOOLING}}/install-cli.sh agentd"

  install:cli:openvox:
    desc: Build + install openvox (pipx if available, else pip)
    cmds:
      - "{{.TOOLING}}/install-cli.sh openvox"

  # ── Release helpers ─────────────────────────────────────────────
  release:check:
    desc: Print detected version for each app (mirrors CI behavior)
    cmds:
      - bash -c 'set -e; for app in agentd openvox voice-client; do printf "%-13s %s\n" "$app" "$(bash {{.TOOLING}}/lib/versions.sh; app_version $app)"; done'

  lint:
    desc: Lint all (agentd typecheck + voice-client flutter analyze; voice-agent uses pytest as structural lint — see CONTRIBUTING.md § 7)
    cmds:
      - bash -c 'set -e; cd {{.ROOT_DIR}}/apps/agentd && pnpm typecheck'
      - bash -c 'set -e; cd {{.ROOT_DIR}}/apps/voice-client && flutter analyze --no-fatal-warnings --no-fatal-infos'
      - echo "voice-agent: structural lint via pytest tests/test_*.py (see CONTRIBUTING.md § 7)"

  lint:agentd:
    desc: Lint agentd only (tsc --noEmit via pnpm)
    dir: apps/agentd
    cmds:
      - pnpm typecheck

  lint:client:
    desc: Lint voice-client only (flutter analyze)
    dir: apps/voice-client
    cmds:
      - flutter analyze --no-fatal-warnings --no-fatal-infos

  docs:check:
    desc: Verify internal links in OpenVox markdown docs (default roots)
    cmds:
      - "{{.TOOLING}}/check-doc-links.sh --strict"

  docs:check:strict:
    desc: Verify internal links + also report missing target files
    cmds:
      - "{{.TOOLING}}/check-doc-links.sh --strict"

  docs:check:quiet:
    desc: Verify internal links, only print summary
    cmds:
      - "{{.TOOLING}}/check-doc-links.sh --strict --quiet"
