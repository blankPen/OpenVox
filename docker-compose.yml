services:
  livekit-agent:
    build: .
    image: livekit-agent:local
    container_name: livekit-agent
    env_file: .env
    environment:
      # Override LIVEKIT_URL because this container reaches the host network
      # via host.docker.internal (Docker Desktop / Docker for Mac).
      # If your LiveKit server runs INSIDE docker on a shared network, set the
      # service name instead (see comments below).
      LIVEKIT_URL: ws://host.docker.internal:7880
    restart: unless-stopped
    # Bridge network is fine — the worker is a client connecting out.
    # Do NOT use host network: that would bind the worker's internal
    # 8081 IPC port on the host and conflict with anything else.
