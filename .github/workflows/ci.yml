name: CI

# Per-PR smoke build for each app. This is intentionally lighter than
# .github/workflows/release.yml (no matrix, no GitHub release publish):
# its job is to catch breakages early, not to produce downloadable assets.

on:
  pull_request:
    paths:
      - "apps/**"
      - "tooling/scripts/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── agentd typecheck + tests + build ────────────────────────────
  agentd:
    name: agentd (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('apps/agentd/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install agentd deps
        working-directory: apps/agentd
        run: pnpm install --frozen-lockfile

      - name: Typecheck agentd
        working-directory: apps/agentd
        run: pnpm typecheck

      - name: Test agentd
        working-directory: apps/agentd
        run: pnpm test

      - name: Build agentd
        working-directory: apps/agentd
        run: pnpm build

  # ── voice-agent: import smoke test + wheel build ────────────────
  voice-agent:
    name: voice-agent (test + wheel build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build openvox wheel + sdist
        working-directory: apps/voice-agent
        run: python -m build

      - name: Verify openvox CLI is importable
        working-directory: apps/voice-agent
        run: |
          set -euo pipefail
          python -m pip install --force-reinstall dist/openvox-*.whl
          openvox --help | head -5

  # ── voice-client android smoke build ────────────────────────────
  client-android:
    name: voice-client android (analyze + apk)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/voice-client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.44.6"

      - name: Cache pub dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.pub-cache
            apps/voice-client/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('apps/voice-client/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Install pub dependencies
        working-directory: apps/voice-client
        run: flutter pub get
      - name: Materialize .env for Flutter assets
        working-directory: apps/voice-client
        run: |
          set -euo pipefail
          # flutter_dotenv bundles .env as a Flutter asset; if it is missing
          # on a fresh checkout the bundler fails. Materialize it from the
          # committed placeholder so CI never blocks on a missing file.
          if [[ ! -f .env ]]; then
            cp .env.example .env
            echo "Created .env from .env.example (placeholder values)."
          else
            echo "Using existing .env (real or local override)."
          fi


      - name: Run flutter analyze (warnings allowed)
        working-directory: apps/voice-client
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build debug APK
        working-directory: apps/voice-client
        run: flutter build apk --debug

      - name: Upload APK for inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-voice-client-android-apk
          path: apps/voice-client/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 3

  # ── voice-client ios smoke build ────────────────────────────────
  client-ios:
    name: voice-client ios (no-codesign .app)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/voice-client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.44.6"

      - name: Cache pub dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.pub-cache
            apps/voice-client/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('apps/voice-client/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Install pub dependencies
        working-directory: apps/voice-client
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
      - name: Materialize .env for Flutter assets
        working-directory: apps/voice-client
        run: |
          set -euo pipefail
          # flutter_dotenv bundles .env as a Flutter asset; if it is missing
          # on a fresh checkout the bundler fails. Materialize it from the
          # committed placeholder so CI never blocks on a missing file.
          if [[ ! -f .env ]]; then
            cp .env.example .env
            echo "Created .env from .env.example (placeholder values)."
          else
            echo "Using existing .env (real or local override)."
          fi


      - name: Build iOS .app (simulator, no codesign)
        working-directory: apps/voice-client
        run: flutter build ios --debug --no-codesign --simulator
