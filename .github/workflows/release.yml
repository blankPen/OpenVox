name: Release

# Tag a commit with `vX.Y.Z` (or run this workflow manually with a tag input)
# and this pipeline builds every distributable artifact, attaches it to a
# GitHub Release, and prints install commands.
#
# Required secret for tag-triggered runs: GITHUB_TOKEN (auto-provided).
# Optional Android signing secrets: ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
# Optional inputs (workflow_dispatch): tag (defaults to the latest v* tag).

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0). Leave empty for a prerelease based on HEAD."
        required: false
        default: ""

permissions:
  contents: write   # create / upload release assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── meta: derive version + tag once, share via outputs ──────────
  meta:
    name: Compute release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - id: meta
        run: |
          set -euo pipefail
          # workflow_dispatch passes the tag in as input; tag-push events
          # expose it via GITHUB_REF_NAME. Fall back to a synthetic prerelease.
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            tag="${{ inputs.tag }}"
          else
            short="$(git rev-parse --short HEAD)"
            tag="v0.0.0-${short}"
          fi

          # Strip leading 'v' for use in artifact filenames.
          if [[ "${tag}" =~ ^v(.+)$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            version="${tag}"
          fi

          # Heuristic: tags with a dash (e.g. v0.2.0-rc1, v0.0.0-abc1234)
          # are marked as prerelease.
          if [[ "${version}" == *-* ]]; then
            is_prerelease="true"
          else
            is_prerelease="false"
          fi

          commit="$(git rev-parse --short HEAD)"
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "is_prerelease=${is_prerelease}"
            echo "commit=${commit}"
          } >> "$GITHUB_OUTPUT"
          echo "release: tag=${tag} version=${version} prerelease=${is_prerelease}"

  # ── agentd: Node CLI, .tgz package ──────────────────────────────
  agentd:
    name: agentd (${{ matrix.os }})
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - name: Install agentd deps
        working-directory: apps/agentd
        run: pnpm install --frozen-lockfile

      - name: Build agentd (TypeScript → dist/)
        working-directory: apps/agentd
        run: pnpm build

      - name: Pack agentd tarball
        working-directory: apps/agentd
        # npm pack outputs "agentd-0.1.0.tgz" — capture into a stable name.
        # `mkdir -p` first; each matrix runner has its own checkout and the
        # artifacts/ directory only exists once some other job created it.
        run: |
          set -euo pipefail
          mkdir -p ../../artifacts
          name="$(npm pack 2>/dev/null | tail -1)"
          mv "$name" "../../artifacts/agentd-${{ needs.meta.outputs.version }}-${{ matrix.os == 'windows-latest' && 'windows' || matrix.os == 'macos-latest' && 'macos' || 'linux' }}.tgz"
        shell: bash

      - name: Upload agentd tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agentd-${{ needs.meta.outputs.version }}-${{ runner.os == 'Windows' && 'windows' || runner.os == 'macOS' && 'macos' || 'linux' }}
          path: artifacts/agentd-${{ needs.meta.outputs.version }}-*.tgz
          if-no-files-found: error
          retention-days: 14

  # ── openvox: Python wheel + sdist ───────────────────────────────
  openvox:
    name: openvox (${{ matrix.os }})
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build openvox wheel + sdist
        working-directory: apps/voice-agent
        # Default Windows shell is pwsh, which doesn't understand bash
        # strict mode — pin shell: bash so the same script runs on every OS.
        run: |
          set -euo pipefail
          python -m build
          mkdir -p ../../artifacts
          mv dist/openvox-*.whl  ../../artifacts/
          mv dist/openvox-*.tar.gz ../../artifacts/
        shell: bash

      - name: Upload openvox artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openvox-${{ needs.meta.outputs.version }}-${{ runner.os == 'Windows' && 'windows' || runner.os == 'macOS' && 'macos' || 'linux' }}
          path: |
            artifacts/openvox-*.whl
            artifacts/openvox-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  # ── voice-client android: APK (debug + release) ─────────────────
  client-android:
    name: voice-client android
    needs: meta
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/voice-client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.44.6"

      - name: Cache pub dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.pub-cache
            apps/voice-client/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('apps/voice-client/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Install pub dependencies
        working-directory: apps/voice-client
        run: flutter pub get
      - name: Materialize .env for Flutter assets
        working-directory: apps/voice-client
        run: |
          set -euo pipefail
          # flutter_dotenv bundles .env as a Flutter asset; if it is missing
          # on a fresh checkout the bundler fails. Materialize it from the
          # committed placeholder so CI never blocks on a missing file.
          if [[ ! -f .env ]]; then
            cp .env.example .env
            echo "Created .env from .env.example (placeholder values)."
          else
            echo "Using existing .env (real or local override)."
          fi


      - name: Run flutter analyze (warnings allowed)
        working-directory: apps/voice-client
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Configure Android release signing
        id: android-signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Android signing secrets are incomplete; publishing the release APK as debug-signed."
            exit 0
          fi

          # Store the keystore next to app/build.gradle where Gradle's
          # `file("upload-keystore.jks")` resolves it.
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=%s\n' 'upload-keystore.jks'
          } > android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: apps/voice-client
        run: flutter build apk --debug

      - name: Build release APK
        working-directory: apps/voice-client
        run: flutter build apk --release
        env:
          # Skip the dependency validation deprecation that otherwise warns
          # loudly; AGP/Gradle/Kotlin versions are tracked via gradle-wrapper.
          FLUTTER_SUPPRESS_ANALYTICS: "true"

      - name: Stage APK artifacts
        env:
          APK_SIGNED: ${{ steps.android-signing.outputs.signed }}
        working-directory: apps/voice-client
        run: |
          set -euo pipefail
          mkdir -p ../../artifacts
          cp build/app/outputs/flutter-apk/app-debug.apk   "../../artifacts/voice-client-${{ needs.meta.outputs.version }}-android-debug.apk"
          if [[ "$APK_SIGNED" == "true" ]]; then
            cp build/app/outputs/flutter-apk/app-release.apk "../../artifacts/voice-client-${{ needs.meta.outputs.version }}-android-release.apk"
          else
            cp build/app/outputs/flutter-apk/app-release.apk "../../artifacts/voice-client-${{ needs.meta.outputs.version }}-android-release-debug-signed.apk"
          fi

      - name: Remove Android signing material
        if: always()
        working-directory: apps/voice-client
        run: rm -f android/key.properties android/app/upload-keystore.jks

      - name: Upload APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voice-client-${{ needs.meta.outputs.version }}-android
          path: artifacts/voice-client-*-android-*.apk
          if-no-files-found: error
          retention-days: 14

  # ── voice-client ios: .app (debug, no codesign) ─────────────────
  client-ios:
    name: voice-client ios
    needs: meta
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/voice-client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js (for CocoaPods scripts)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.44.6"

      - name: Cache pub dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.pub-cache
            apps/voice-client/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('apps/voice-client/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Install pub dependencies
        working-directory: apps/voice-client
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
      - name: Materialize .env for Flutter assets
        working-directory: apps/voice-client
        run: |
          set -euo pipefail
          # flutter_dotenv bundles .env as a Flutter asset; if it is missing
          # on a fresh checkout the bundler fails. Materialize it from the
          # committed placeholder so CI never blocks on a missing file.
          if [[ ! -f .env ]]; then
            cp .env.example .env
            echo "Created .env from .env.example (placeholder values)."
          else
            echo "Using existing .env (real or local override)."
          fi


      - name: Build iOS .app (debug, no codesign)
        working-directory: apps/voice-client
        # --no-codesign produces the iphoneos slice without provisioning.
        # --simulator additionally produces the simulator slice so CI can
        # run on either architecture.
        run: flutter build ios --debug --no-codesign --simulator
        env:
          # The local scripts may reference $HOME/.pub-cache for patrol.
          PUB_CACHE: ${{ github.workspace }}/.pub-cache

      - name: Stage iOS artifacts
        working-directory: apps/voice-client
        run: |
          set -euo pipefail
          mkdir -p ../../artifacts
          # Bundle both simulator + device slices for flexibility.
          if [[ -d build/ios/iphonesimulator/Runner.app ]]; then
            ditto -c -k --sequesterRsrc --keepParent \
              build/ios/iphonesimulator/Runner.app \
              "../../artifacts/voice-client-${{ needs.meta.outputs.version }}-ios-simulator.zip"
          fi
          if [[ -d build/ios/iphoneos/Runner.app ]]; then
            ditto -c -k --sequesterRsrc --keepParent \
              build/ios/iphoneos/Runner.app \
              "../../artifacts/voice-client-${{ needs.meta.outputs.version }}-ios-device.zip"
          fi

      - name: Upload iOS bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voice-client-${{ needs.meta.outputs.version }}-ios
          path: artifacts/voice-client-*-ios-*.zip
          if-no-files-found: error
          retention-days: 14

  # ── release: assemble GitHub release with all artifacts ─────────
  release:
    name: Publish GitHub release
    needs: [meta, agentd, openvox, client-android, client-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List collected artifacts
        run: |
          set -euo pipefail
          echo "=== artifacts/ ==="
          ls -lhR artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # softprops/action-gh-release@v2 was observed to corrupt binary
          # uploads (the wheel landed on the release page with a missing
          # __init__.py and a wrong-CRC cli.py even though the artifact
          # zip was fine). Use gh CLI directly — it streams each asset
          # via the assets API and doesn't munge bytes.
          VERSION: ${{ needs.meta.outputs.version }}
          TAG: ${{ needs.meta.outputs.tag }}
          PRERELEASE_FLAG: ${{ needs.meta.outputs.is_prerelease == 'true' && '--prerelease' || '' }}
        run: |
          set -euo pipefail
          # download-artifact with merge-multiple puts each artifact at the
          # top level of artifacts/, so `artifacts/*` is enough. Use globstar
          # too so any future nested layout still works.
          shopt -s nullglob globstar
          asset_args=()
          for f in artifacts/*.{tgz,whl,tar.gz,apk,zip} artifacts/**/*.tgz artifacts/**/*.whl artifacts/**/*.tar.gz artifacts/**/*.apk artifacts/**/*.zip; do
            asset_args+=("$f")
          done
          # de-dupe while preserving order
          declare -A seen=()
          unique_args=()
          for f in "${asset_args[@]}"; do
            if [[ -z "${seen[$f]:-}" ]]; then
              unique_args+=("$f")
              seen[$f]=1
            fi
          done
          asset_args=("${unique_args[@]}")
          if [[ ${#asset_args[@]} -eq 0 ]]; then
            echo "::error::No artifacts to publish"
            exit 1
          fi
          gh release create "$TAG"             --repo "$GITHUB_REPOSITORY"             --title "OpenVox $TAG"             --generate-notes             $PRERELEASE_FLAG             "${asset_args[@]}"
          echo
          echo "Release published: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"

      - name: Print install instructions
        if: success()
        run: |
          set -euo pipefail
          tag="${{ needs.meta.outputs.tag }}"
          echo
          echo "## Install (release $tag)"
          echo
          echo "### agentd (Node CLI)"
          echo '```'
          echo "# pick your platform: agentd-${tag}-linux.tgz | macos.tgz | windows.tgz"
          echo "curl -sSL -o agentd.tgz \\"
          echo "  https://github.com/${{ github.repository }}/releases/download/$tag/agentd-${{ needs.meta.outputs.version }}-\$(uname | tr '[:upper:]' '[:lower:]').tgz"
          echo "npm install -g ./agentd.tgz     # or: pnpm add -g ./agentd.tgz"
          echo '```'
          echo
          echo "### openvox (Python CLI)"
          echo '```'
          echo "pip install --user openvox-${{ needs.meta.outputs.version }}-py3-none-any.whl"
          echo "# or: pipx install openvox-${{ needs.meta.outputs.version }}.tar.gz"
          echo '```'
          echo
          echo "### voice-client (Android)"
          echo '```'
          echo "adb install voice-client-${{ needs.meta.outputs.version }}-android-release.apk"
          echo "# Without signing secrets, use the explicitly named *-release-debug-signed.apk asset."
          echo '```'
          echo
          echo "### voice-client (iOS)"
          echo '```'
          echo "unzip voice-client-${{ needs.meta.outputs.version }}-ios-device.zip   # → Runner.app"
          echo "# sideload with ios-deploy / Xcode / AltStore"
          echo '```'
